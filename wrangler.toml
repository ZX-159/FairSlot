# FairSlot — Cloudflare Workers + Static Assets
name = "fairslot"
main = "functions/worker.js"
compatibility_date = "2025-10-04"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker must see /api/* before the asset server (avoids POST 405).
run_worker_first = true

# Set real values in the Cloudflare dashboard (Workers → fairslot → Settings
# → Variables and Secrets). Do NOT commit secrets here.
#
# Required vars:
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   VITE_SUPABASE_URL              (build-time for SPA)
#   VITE_SUPABASE_ANON_KEY         (build-time for SPA)
#   NEXT_PUBLIC_SUPABASE_URL       (alias)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  (alias)
#
# Required secret:
#   SUPABASE_SERVICE_ROLE_KEY
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
